name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=C9A96E&color_dot_0=ebedf0&color_dot_1=fdf0d0&color_dot_2=e8c170&color_dot_3=C9A96E&color_dot_4=8B6914
            dist/snake-dark.svg?palette=github-dark&color_snake=C9A96E&color_dot_0=161b22&color_dot_1=3d2b0a&color_dot_2=7a5520&color_dot_3=C9A96E&color_dot_4=f0d080

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
